name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  # Codecov へ OIDC でアップロードするため（CODECOV_TOKEN の secret は不要）
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: テスト（Unit + Integration）+ カバレッジ計測
        run: pnpm test:coverage

      - name: Codecov へアップロード（desktop）
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          # files で指定したファイルだけを送る（自動検索で他アプリの lcov が混ざるのを防ぐ）
          disable_search: true
          files: apps/desktop/coverage/lcov.info
          flags: desktop
          fail_ci_if_error: false
